name: UK AISI Inspect Public Audit (v2.1 Paired Baseline, Matched-Vote & BYT)

on:
  workflow_dispatch:
    inputs:
      audit_mode:
        description: "Comparison mode (Arm A routes directly to upstream provider whenever BYT_API_KEY/DIRECT_BASELINE_API_KEY is supplied)"
        required: true
        default: "free_zero_cost"
        type: choice
        options:
          - free_zero_cost
          - free_big4_vs_direct_provider
          - byt_model_boost
          - free_big4_vs_byt_naked
      target_model:
        description: "Upstream model ID for direct Arm A baseline / BYT (e.g. google/gemma-4-31b-it, anthropic/claude-sonnet-4.6, openai/gpt-4o)"
        required: false
        default: ""
        type: string
      byt_provider:
        description: "Upstream provider override (auto detects from key prefix or model slug)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - openrouter
          - anthropic
          - openai
          - gemini
          - groq
          - deepseek
          - xai
          - mistral
          - cerebras
          - nvidia
      sample_limit:
        description: "Samples per benchmark (55 = 220-item statistical audit across 4 suites; 100 = 400-item deep audit)"
        required: false
        default: "55"
        type: string
      sample_seed:
        description: "Shuffle seed ('random' generates a fresh CSPRNG seed at runtime; or pass an explicit non-negative integer)"
        required: false
        default: "random"
        type: string
      custom_holdout_jsonl:
        description: "Optional repo-relative path to private holdout JSONL (e.g. examples/private_holdout_sample.jsonl)"
        required: false
        default: ""
        type: string
      arm_a_epochs:
        description: "Number of Arm A samples per item (3 or 5 enables Inspect --epochs-reducer mode at temperature 0.6)"
        required: false
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
      include_swe_repair:
        description: "Run deterministic 20-item Python invariant bug-repair suite (tasks/verifiable_swe_eval.py) inside airgapped Docker sandbox"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  uk-aisi-inspect-audit:
    name: Hardened Inspect Public Audit (v2.1)
    runs-on: ubuntu-latest
    timeout-minutes: 210

    steps:
      - name: Checkout public audit repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies from lockfile and run unit tests
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
          python3 -m pip freeze | grep -E '^(inspect-ai|inspect-evals|openai|cryptography|datasets|PyYAML|pytest)=='
          pytest -q

      - name: Pre-Flight Verify Airgapped HumanEval Docker Sandbox
        run: |
          docker compose -f docker/humaneval-compose.yaml pull
          docker compose -f docker/humaneval-compose.yaml up -d
          BIG4_API_KEY="canary_must_not_leak" BYT_API_KEY="canary_must_not_leak" DIRECT_BASELINE_API_KEY="canary_must_not_leak" \
            docker compose -f docker/humaneval-compose.yaml exec -T default \
            python3 -c 'import os, socket; assert "BIG4_API_KEY" not in os.environ and "BYT_API_KEY" not in os.environ and "DIRECT_BASELINE_API_KEY" not in os.environ; tcp_ok = False; dns_ok = False
          try:
              socket.create_connection(("1.1.1.1", 443), timeout=2)
              tcp_ok = True
          except OSError:
              pass
          try:
              socket.gethostbyname("example.com")
              dns_ok = True
          except OSError:
              pass
          assert not tcp_ok and not dns_ok, "Sandbox unexpectedly had network or DNS access!"
          print("DOCKER_SANDBOX_ISOLATION_VERIFIED: zero host credentials, no DNS, network_mode=none")'
          docker compose -f docker/humaneval-compose.yaml down --remove-orphans

      - name: Resolve Audit Configuration & Mask Secrets
        env:
          BIG4_BASE_URL: ${{ secrets.BIG4_BASE_URL || 'https://104-207-84-209.sslip.io/v1' }}
          BIG4_API_KEY: ${{ secrets.BIG4_API_KEY }}
          BYT_API_KEY: ${{ secrets.BYT_API_KEY }}
          DIRECT_BASELINE_API_KEY: ${{ secrets.DIRECT_BASELINE_API_KEY }}
          RAW_AUDIT_MODE: ${{ github.event.inputs.audit_mode || 'free_zero_cost' }}
          RAW_TARGET_MODEL: ${{ github.event.inputs.target_model || '' }}
          RAW_BYT_PROVIDER: ${{ github.event.inputs.byt_provider || 'auto' }}
          RAW_SAMPLE_SEED: ${{ github.event.inputs.sample_seed || 'random' }}
          RAW_CUSTOM_HOLDOUT_JSONL: ${{ github.event.inputs.custom_holdout_jsonl || '' }}
          RAW_ARM_A_EPOCHS: ${{ github.event.inputs.arm_a_epochs || '1' }}
          RAW_INCLUDE_SWE_REPAIR: ${{ github.event.inputs.include_swe_repair || 'false' }}
        run: |
          python3 scripts/resolve_audit_config.py --github-env "${GITHUB_ENV}" --emit-masks

      - name: Verify Dedicated VPS Endpoint Routing (Arm B Target)
        env:
          BIG4_BASE_URL: ${{ secrets.BIG4_BASE_URL || 'https://104-207-84-209.sslip.io/v1' }}
        run: |
          ping -c 3 -W 2 104.207.84.209 || echo "Note: Azure-hosted runners filter outbound raw ICMP; verifying DNS + live TLS :443 socket peer IP..."
          python3 scripts/verify_vps_target.py \
            --expected-ip 104.207.84.209 \
            --tcp-pings 3 \
            --out vps_target_proof.json

      - name: Stage Ephemeral Secret Holdout If Configured
        env:
          PRIVATE_HOLDOUT_JSONL_B64: ${{ secrets.PRIVATE_HOLDOUT_JSONL_B64 }}
          PRIVATE_HOLDOUT_JSONL: ${{ secrets.PRIVATE_HOLDOUT_JSONL }}
        run: |
          rm -f /tmp/big4_secret_holdout.jsonl
          if [ -n "${PRIVATE_HOLDOUT_JSONL_B64}" ]; then
            printf '%s' "${PRIVATE_HOLDOUT_JSONL_B64}" | tr -d '[:space:]' | base64 --decode > /tmp/big4_secret_holdout.jsonl
            chmod 600 /tmp/big4_secret_holdout.jsonl
            echo "SECRET_HOLDOUT_JSONL=/tmp/big4_secret_holdout.jsonl" >> "${GITHUB_ENV}"
            echo "Staged secret-injected private holdout (base64) to ephemeral runner file."
          elif [ -n "${PRIVATE_HOLDOUT_JSONL}" ]; then
            printf '%s\n' "${PRIVATE_HOLDOUT_JSONL}" > /tmp/big4_secret_holdout.jsonl
            chmod 600 /tmp/big4_secret_holdout.jsonl
            echo "SECRET_HOLDOUT_JSONL=/tmp/big4_secret_holdout.jsonl" >> "${GITHUB_ENV}"
            echo "Staged secret-injected private holdout to ephemeral runner file."
          fi

      - name: Run UK AISI Inspect on Arm A (Direct Upstream Baseline or Zero-Key Demo)
        env:
          UPSTREAM_BASE_URL: ${{ env.UPSTREAM_BASE_URL }}
          UPSTREAM_API_KEY: ${{ secrets.DIRECT_BASELINE_API_KEY || secrets.BYT_API_KEY }}
          BIG4_BASE_URL: ${{ secrets.BIG4_BASE_URL || 'https://104-207-84-209.sslip.io/v1' }}
          BIG4_API_KEY: ${{ secrets.BIG4_API_KEY }}
          LIMIT: ${{ github.event.inputs.sample_limit || '55' }}
        run: |
          [[ "${LIMIT}" =~ ^[0-9]+$ ]] && [ "${LIMIT}" -ge 1 ] && [ "${LIMIT}" -le 1000 ] || { echo "Invalid sample_limit: ${LIMIT}" >&2; exit 1; }
          if [ "${ARM_A_INDEPENDENT}" = "true" ]; then
            unset BIG4_API_KEY BIG4_BASE_URL
          else
            unset UPSTREAM_API_KEY UPSTREAM_BASE_URL
          fi
          mkdir -p logs/arm_a
          EPOCH_FLAGS="--epochs 1 --temperature ${ARM_A_TEMPERATURE}"
          if [ "${ARM_A_EPOCHS}" -gt 1 ]; then
            EPOCH_FLAGS="--epochs ${ARM_A_EPOCHS} --epochs-reducer mode --temperature ${ARM_A_TEMPERATURE}"
          fi
          COMMON_FLAGS="--model ${ARM_A_INSPECT_MODEL} -M stream=false -M client_timeout=210 --limit ${LIMIT} ${EPOCH_FLAGS} --max-tokens 8192 --max-connections 3 --max-sandboxes 2 --no-fail-on-error --score-on-error --retry-on-error=2 --display=plain --log-dir logs/arm_a"
          inspect eval inspect_evals/mmlu_pro -T shuffle=false --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          inspect eval inspect_evals/truthfulqa -T target=mc1 --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          inspect eval inspect_evals/gpqa_diamond --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          inspect eval inspect_evals/humaneval --sandbox docker:docker/humaneval-compose.yaml --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          if [ "${INCLUDE_SWE_REPAIR:-false}" = "true" ]; then
            inspect eval tasks/verifiable_swe_eval.py --sandbox docker:docker/humaneval-compose.yaml --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          fi
          if [ -n "${CUSTOM_HOLDOUT_JSONL}" ]; then
            [[ "${CUSTOM_HOLDOUT_JSONL}" != /* && "${CUSTOM_HOLDOUT_JSONL}" != *".."* && -f "${CUSTOM_HOLDOUT_JSONL}" ]] || { echo "Invalid custom_holdout_jsonl path" >&2; exit 1; }
            inspect eval tasks/private_holdout_eval.py -T "dataset_path=${CUSTOM_HOLDOUT_JSONL}" --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          elif [ -n "${SECRET_HOLDOUT_JSONL:-}" ] && [ -f "${SECRET_HOLDOUT_JSONL}" ]; then
            inspect eval tasks/private_holdout_eval.py -T "dataset_path=${SECRET_HOLDOUT_JSONL}" --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          fi

      - name: Run UK AISI Inspect on Arm B (Big4 Cycle 5 via Local Receipt-Verifying Proxy)
        env:
          REAL_BIG4_BASE_URL: ${{ secrets.BIG4_BASE_URL || 'https://104-207-84-209.sslip.io/v1' }}
          BIG4_API_KEY: ${{ secrets.BIG4_API_KEY }}
          BYT_API_KEY: ${{ secrets.BYT_API_KEY }}
          LIMIT: ${{ github.event.inputs.sample_limit || '55' }}
        run: |
          [[ "${LIMIT}" =~ ^[0-9]+$ ]] && [ "${LIMIT}" -ge 1 ] && [ "${LIMIT}" -le 1000 ] || { echo "Invalid sample_limit: ${LIMIT}" >&2; exit 1; }
          if [ "${ARM_B_USES_BYT}" != "true" ]; then
            unset BYT_API_KEY
          else
            echo "::add-mask::${BYT_API_KEY}"
          fi
          mkdir -p logs/arm_b
          EXTRA_FLAGS="--require-zdr"
          if [ "${AUDIT_MODE}" = "free_zero_cost" ]; then
            EXTRA_FLAGS="${EXTRA_FLAGS} --require-zero-cost"
          fi

          python3 scripts/local_receipt_proxy.py \
            --listen-host 127.0.0.1 \
            --listen-port 18080 \
            --upstream-base-url "${REAL_BIG4_BASE_URL}" \
            --public-key public_key_ed25519.pem \
            --receipt-log logs/arm_b_live_receipts.jsonl \
            ${EXTRA_FLAGS} &
          PROXY_PID=$!
          trap 'kill ${PROXY_PID} 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            sleep 0.5
          done

          if [ "${ARM_B_USES_BYT}" = "true" ]; then
            COMPOSITE_KEY="${BIG4_API_KEY}|byt:${BYT_PROVIDER}|${BYT_API_KEY}"
            echo "::add-mask::${COMPOSITE_KEY}"
            export BIG4_API_KEY="${COMPOSITE_KEY}"
          fi
          export BIG4_BASE_URL="http://127.0.0.1:18080/v1"

          COMMON_FLAGS="--model ${ARM_B_INSPECT_MODEL} -M stream=false -M client_timeout=210 --limit ${LIMIT} --epochs 1 --temperature 0 --max-tokens 8192 --max-connections 3 --max-sandboxes 2 --no-fail-on-error --score-on-error --retry-on-error=2 --display=plain --log-dir logs/arm_b"
          inspect eval inspect_evals/mmlu_pro -T shuffle=false --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          inspect eval inspect_evals/truthfulqa -T target=mc1 --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          inspect eval inspect_evals/gpqa_diamond --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          inspect eval inspect_evals/humaneval --sandbox docker:docker/humaneval-compose.yaml --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          if [ "${INCLUDE_SWE_REPAIR:-false}" = "true" ]; then
            inspect eval tasks/verifiable_swe_eval.py --sandbox docker:docker/humaneval-compose.yaml --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          fi
          if [ -n "${CUSTOM_HOLDOUT_JSONL}" ]; then
            [[ "${CUSTOM_HOLDOUT_JSONL}" != /* && "${CUSTOM_HOLDOUT_JSONL}" != *".."* && -f "${CUSTOM_HOLDOUT_JSONL}" ]] || { echo "Invalid custom_holdout_jsonl path" >&2; exit 1; }
            inspect eval tasks/private_holdout_eval.py -T "dataset_path=${CUSTOM_HOLDOUT_JSONL}" --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          elif [ -n "${SECRET_HOLDOUT_JSONL:-}" ] && [ -f "${SECRET_HOLDOUT_JSONL}" ]; then
            inspect eval tasks/private_holdout_eval.py -T "dataset_path=${SECRET_HOLDOUT_JSONL}" --sample-shuffle=${SAMPLE_SEED} ${COMMON_FLAGS}
          fi

      - name: Verify Captured Benchmark Ed25519 Receipts Offline
        run: |
          EXTRA_FLAGS="--require-zdr"
          if [ "${AUDIT_MODE}" = "free_zero_cost" ]; then
            EXTRA_FLAGS="${EXTRA_FLAGS} --require-zero-cost"
          fi
          python3 scripts/verify_ed25519_receipt.py \
            --public-key public_key_ed25519.pem \
            --jsonl-in logs/arm_b_live_receipts.jsonl \
            ${EXTRA_FLAGS} \
            --out ed25519_audit_report.json

      - name: Render Public Audit Summary, Paired Statistics & Leak Check
        env:
          BIG4_BASE_URL: ${{ secrets.BIG4_BASE_URL || 'https://104-207-84-209.sslip.io/v1' }}
          BIG4_API_KEY: ${{ secrets.BIG4_API_KEY }}
          BYT_API_KEY: ${{ secrets.BYT_API_KEY }}
          DIRECT_BASELINE_API_KEY: ${{ secrets.DIRECT_BASELINE_API_KEY }}
        run: |
          python3 scripts/render_step_summary.py \
            --arm-a-dir logs/arm_a \
            --arm-b-dir logs/arm_b \
            --arm-a-label "${ARM_A_LABEL}" \
            --arm-b-label "${ARM_B_LABEL}" \
            --arm-a-routing-mode "${ARM_A_ROUTING_MODE}" \
            --arm-a-independent "${ARM_A_INDEPENDENT}" \
            --audit-mode "${AUDIT_MODE}" \
            --target-model "${TARGET_MODEL}" \
            --sample-seed "${SAMPLE_SEED}" \
            --ed25519 ed25519_audit_report.json \
            --vps-proof vps_target_proof.json \
            --samples-out sanitized_sample_outcomes.json \
            --out public_audit_summary.json

      - name: Upload Sanitized Audit Artifacts (Zero Trade Secrets)
        uses: actions/upload-artifact@v4
        with:
          name: uk-aisi-public-audit-summary
          path: |
            public_audit_summary.json
            sanitized_sample_outcomes.json
            ed25519_audit_report.json
            vps_target_proof.json
          retention-days: 90

      - name: Cleanup Ephemeral Secret Holdout
        if: always()
        run: rm -f /tmp/big4_secret_holdout.jsonl
