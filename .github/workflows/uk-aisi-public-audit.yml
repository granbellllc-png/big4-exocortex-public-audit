name: UK AISI Inspect Public Audit ($0.00 & BYT)

on:
  workflow_dispatch:
    inputs:
      audit_mode:
        description: "Audit comparison mode"
        required: true
        default: "free_zero_cost"
        type: choice
        options:
          - free_zero_cost
          - byt_model_boost
          - free_big4_vs_byt_naked
      target_model:
        description: "Specific model ID for BYT or custom baseline (e.g. google/gemma-4-31b-it, claude-sonnet-4-6, gpt-4o)"
        required: false
        default: ""
        type: string
      byt_provider:
        description: "BYT provider override (auto detects from key prefix or OpenRouter)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - openrouter
          - anthropic
          - openai
          - gemini
          - groq
          - deepseek
          - xai
          - mistral
          - cerebras
          - nvidia
      sample_limit:
        description: "Blind samples per benchmark (15 => 60 total items per model)"
        required: false
        default: "15"
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  uk-aisi-inspect-audit:
    name: UK AISI Inspect Head-to-Head + Offline Ed25519
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout public audit repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install unmodified UK AISI Inspect framework from PyPI
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "inspect-ai>=0.3.285" "inspect-evals>=0.29.0" openai cryptography "datasets>=4.8.5"
          python3 -m pip freeze | grep -E '^(inspect-ai|inspect-evals|openai|cryptography|datasets)=='

      - name: Resolve Audit Configuration & Mask Encrypted Secrets
        env:
          BIG4_BASE_URL: ${{ secrets.BIG4_BASE_URL }}
          BIG4_API_KEY: ${{ secrets.BIG4_API_KEY }}
          BYT_API_KEY: ${{ secrets.BYT_API_KEY }}
          RAW_AUDIT_MODE: ${{ github.event.inputs.audit_mode || 'free_zero_cost' }}
          RAW_TARGET_MODEL: ${{ github.event.inputs.target_model || '' }}
          RAW_BYT_PROVIDER: ${{ github.event.inputs.byt_provider || 'auto' }}
        run: |
          python3 - <<'EOF'
          import os, re, urllib.parse

          url = os.environ.get("BIG4_BASE_URL", "").strip()
          key = os.environ.get("BIG4_API_KEY", "").strip()
          byt = os.environ.get("BYT_API_KEY", "").strip()
          mode = (os.environ.get("RAW_AUDIT_MODE") or "free_zero_cost").strip()
          target = (os.environ.get("RAW_TARGET_MODEL") or "").strip()
          byt_prov = (os.environ.get("RAW_BYT_PROVIDER") or "auto").strip().lower()

          if not url or not key:
              raise SystemExit("ERROR: BIG4_BASE_URL and BIG4_API_KEY repository secrets must both be configured.")

          print(f"::add-mask::{url}")
          host = urllib.parse.urlparse(url).hostname or ""
          if host:
              print(f"::add-mask::{host}")
              nums = re.findall(r"\d+", host)
              if len(nums) >= 3:
                  print(f"::add-mask::{'.'.join(nums[:4])}")
                  print(f"::add-mask::{'-'.join(nums[:4])}")
          print(f"::add-mask::{key}")
          if byt:
              print(f"::add-mask::{byt}")
              print(f"::add-mask::{key}|byt:{byt_prov}|{byt}")
              print(f"::add-mask::{key}|byt:auto|{byt}")

          if mode in ("byt_model_boost", "free_big4_vs_byt_naked") and not byt:
              raise SystemExit(
                  f"ERROR: audit_mode='{mode}' requires configuring the encrypted BYT_API_KEY secret "
                  "in Settings -> Secrets and variables -> Actions."
              )

          if "|" in target or "\n" in target or "\r" in target:
              raise SystemExit("ERROR: target_model contains invalid control or delimiter characters.")

          suffix = f":{target}" if target else ""
          if mode == "byt_model_boost":
              arm_a_model = f"big4-base-byt-nudo{suffix}"
              arm_b_model = f"big4-ciclo5-byt{suffix}"
              arm_a_label = f"Naked Specific Model ({target or 'BYT default'})"
              arm_b_label = f"Big4 Cycle 5 Boosted ({target or 'BYT default'})"
              arm_a_byt = "true"
              arm_b_byt = "true"
              probe_model = arm_b_model
              probe_byt = "true"
          elif mode == "free_big4_vs_byt_naked":
              arm_a_model = f"big4-base-byt-nudo{suffix}"
              arm_b_model = "big4-ciclo5-free"
              arm_a_label = f"Naked BYT Model ({target or 'BYT default'})"
              arm_b_label = "Big4 Cycle 5 ($0.00)"
              arm_a_byt = "true"
              arm_b_byt = "false"
              probe_model = "big4-ciclo5-free"
              probe_byt = "false"
          else:
              arm_a_model = f"big4-base-free-nudo{suffix}"
              arm_b_model = "big4-ciclo5-free"
              arm_a_label = f"Naked $0.00 ({target or 'Baseline'})"
              arm_b_label = "Big4 Cycle 5 ($0.00)"
              arm_a_byt = "false"
              arm_b_byt = "false"
              probe_model = "big4-ciclo5-free"
              probe_byt = "false"

          gh_env = os.environ.get("GITHUB_ENV")
          if gh_env:
              with open(gh_env, "a", encoding="utf-8") as fh:
                  for k, v in {
                      "AUDIT_MODE": mode,
                      "TARGET_MODEL": target,
                      "BYT_PROVIDER": byt_prov,
                      "ARM_A_MODEL": arm_a_model,
                      "ARM_B_MODEL": arm_b_model,
                      "ARM_A_LABEL": arm_a_label,
                      "ARM_B_LABEL": arm_b_label,
                      "ARM_A_USES_BYT": arm_a_byt,
                      "ARM_B_USES_BYT": arm_b_byt,
                      "PROBE_MODEL": probe_model,
                      "PROBE_USES_BYT": probe_byt,
                  }.items():
                      fh.write(f"{k}={v}\n")

          print(f"Configured audit_mode={mode}, arm_a_uses_byt={arm_a_byt}, arm_b_uses_byt={arm_b_byt} (secrets masked)")
          EOF

      - name: Run UK AISI Inspect on Arm A (Baseline)
        env:
          BIG4_BASE_URL: ${{ secrets.BIG4_BASE_URL }}
          BIG4_API_KEY: ${{ secrets.BIG4_API_KEY }}
          BYT_API_KEY: ${{ secrets.BYT_API_KEY }}
          LIMIT: ${{ github.event.inputs.sample_limit || '15' }}
        run: |
          if [ "${ARM_A_USES_BYT}" = "true" ]; then
            COMPOSITE_KEY="${BIG4_API_KEY}|byt:${BYT_PROVIDER}|${BYT_API_KEY}"
            echo "::add-mask::${COMPOSITE_KEY}"
            export BIG4_API_KEY="${COMPOSITE_KEY}"
          fi
          mkdir -p logs/arm_a
          COMMON_FLAGS="--model openai-api/big4/${ARM_A_MODEL} -M client_timeout=210 --limit ${LIMIT} --epochs 1 --temperature 0 --max-tokens 8192 --max-connections 3 --no-fail-on-error --score-on-error --retry-on-error=2 --display=plain --log-dir logs/arm_a"
          inspect eval inspect_evals/mmlu_pro -T shuffle=false --sample-shuffle=42 ${COMMON_FLAGS}
          inspect eval inspect_evals/truthfulqa -T target=mc1 --sample-shuffle=42 ${COMMON_FLAGS}
          inspect eval inspect_evals/gpqa_diamond --sample-shuffle=42 ${COMMON_FLAGS}
          inspect eval inspect_evals/humaneval -T sandbox=local --sample-shuffle=42 ${COMMON_FLAGS}

      - name: Run UK AISI Inspect on Arm B (Big4 Cycle 5)
        env:
          BIG4_BASE_URL: ${{ secrets.BIG4_BASE_URL }}
          BIG4_API_KEY: ${{ secrets.BIG4_API_KEY }}
          BYT_API_KEY: ${{ secrets.BYT_API_KEY }}
          LIMIT: ${{ github.event.inputs.sample_limit || '15' }}
        run: |
          if [ "${ARM_B_USES_BYT}" = "true" ]; then
            COMPOSITE_KEY="${BIG4_API_KEY}|byt:${BYT_PROVIDER}|${BYT_API_KEY}"
            echo "::add-mask::${COMPOSITE_KEY}"
            export BIG4_API_KEY="${COMPOSITE_KEY}"
          fi
          mkdir -p logs/arm_b
          COMMON_FLAGS="--model openai-api/big4/${ARM_B_MODEL} -M client_timeout=210 --limit ${LIMIT} --epochs 1 --temperature 0 --max-tokens 8192 --max-connections 2 --no-fail-on-error --score-on-error --retry-on-error=2 --display=plain --log-dir logs/arm_b"
          inspect eval inspect_evals/mmlu_pro -T shuffle=false --sample-shuffle=42 ${COMMON_FLAGS}
          inspect eval inspect_evals/truthfulqa -T target=mc1 --sample-shuffle=42 ${COMMON_FLAGS}
          inspect eval inspect_evals/gpqa_diamond --sample-shuffle=42 ${COMMON_FLAGS}
          inspect eval inspect_evals/humaneval -T sandbox=local --sample-shuffle=42 ${COMMON_FLAGS}

      - name: Verify Offline Ed25519 Cryptographic Receipts
        env:
          BIG4_BASE_URL: ${{ secrets.BIG4_BASE_URL }}
          BIG4_API_KEY: ${{ secrets.BIG4_API_KEY }}
          BYT_API_KEY: ${{ secrets.BYT_API_KEY }}
        run: |
          EXTRA_BYT=""
          if [ "${PROBE_USES_BYT}" = "true" ]; then
            EXTRA_BYT="--byt-api-key ${BYT_API_KEY} --byt-provider ${BYT_PROVIDER}"
          fi
          python3 scripts/verify_ed25519_receipt.py \
            --public-key public_key_ed25519.pem \
            --live-probe-count 5 \
            --model "${PROBE_MODEL}" \
            ${EXTRA_BYT} \
            --out ed25519_audit_report.json

      - name: Render Public Audit Summary & Secret Leak Self-Check
        env:
          BIG4_BASE_URL: ${{ secrets.BIG4_BASE_URL }}
          BIG4_API_KEY: ${{ secrets.BIG4_API_KEY }}
          BYT_API_KEY: ${{ secrets.BYT_API_KEY }}
        run: |
          python3 scripts/render_step_summary.py \
            --arm-a-dir logs/arm_a \
            --arm-b-dir logs/arm_b \
            --arm-a-label "${ARM_A_LABEL}" \
            --arm-b-label "${ARM_B_LABEL}" \
            --audit-mode "${AUDIT_MODE}" \
            --target-model "${TARGET_MODEL}" \
            --ed25519 ed25519_audit_report.json \
            --out public_audit_summary.json

      - name: Upload Sanitized Public Audit Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uk-aisi-public-audit-summary
          path: |
            public_audit_summary.json
            ed25519_audit_report.json
          retention-days: 90
